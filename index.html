<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>校园二手 · 闲置交易</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 应用根容器 -->
  <div id="app">
    <!-- 页面内容区（由 JS 动态渲染） -->
    <main id="page-container"></main>

    <!-- 全局 Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- 全局 Loading 遮罩 -->
    <div id="loading-mask" class="loading-mask hidden">
      <div class="loading-spinner"></div>
    </div>

    <!-- 底部 Tab 导航 -->
    <nav id="bottom-nav" class="bottom-nav">
      <div class="nav-item" data-route="home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="nav-item" data-route="category">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>分类</span>
      </div>
      <!-- 中间突出发布按钮 -->
      <div class="nav-item nav-publish" data-route="publish">
        <div class="publish-btn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <span>发布</span>
      </div>
      <div class="nav-item" data-route="books">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>二手书</span>
      </div>
      <div class="nav-item" data-route="profile">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
    </nav>
  </div>

  <!-- 脚本 -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
